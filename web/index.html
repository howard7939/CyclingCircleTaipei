<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>環騎臺北 — 騎乘條件</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%9A%B4%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  /* 類別色來自 dataviz 參考色盤 slot 1/2/3，已用 validate_palette.js --pairs all
     驗證通過（最差 CVD ΔE 9.2）。語意直覺的「綠=山區」被否決：綠↔橘在 protan
     下 ΔE 僅 3.2。逆風/順風為雙極量，依規則用藍↔紅 + 中性灰中點。 */
  :root {
    --riverside:#2a78d6; --urban:#eb6834; --mountain:#1baf7a;
    --surface:#fcfcfb; --plane:#f4f4f1; --ink:#0b0b0b; --ink-2:#52514e; --ink-muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --hair:rgba(11,11,11,.10);
    --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
    --panel-w:338px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
       background:var(--plane);display:flex;flex-direction:column;overflow:hidden}

  header{flex:none;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
         padding:9px 16px;background:var(--surface);border-bottom:1px solid var(--hair)}
  header h1{margin:0;font-size:15px;font-weight:650}
  header .meta{color:var(--ink-muted);font-size:12px;font-variant-numeric:tabular-nums}
  header .spacer{flex:1}
  #stale{display:none;padding:2px 8px;border-radius:99px;background:#fff6e5;color:#7a5200;
         border:1px solid var(--warn);font-size:11.5px}

  main{flex:1;display:flex;min-height:0}
  #panel{flex:none;width:var(--panel-w);overflow-y:auto;background:var(--surface);
         border-right:1px solid var(--hair);padding:0 0 28px}
  #map{flex:1;min-width:0;background:var(--grid)}

  .sec{padding:14px 16px;border-bottom:1px solid var(--hair)}
  .sec>h2{margin:0 0 9px;font-size:11px;font-weight:650;letter-spacing:.08em;
          text-transform:uppercase;color:var(--ink-muted)}

  /* 結論卡 */
  #verdict{padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--hair)}
  .vd-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .vd-dir{font-size:26px;font-weight:680;letter-spacing:-.01em;line-height:1.15}
  .vd-gain{font-size:15px;font-weight:600;color:var(--good);font-variant-numeric:tabular-nums}
  .vd-sub{margin-top:5px;color:var(--ink-2);font-size:12.5px;font-variant-numeric:tabular-nums}
  .vd-split{margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .vd-cell{background:var(--plane);border-radius:7px;padding:7px 9px}
  .vd-cell .k{font-size:11px;color:var(--ink-muted)}
  .vd-cell .v{font-size:15px;font-weight:620;font-variant-numeric:tabular-nums}
  .vd-cell{font:inherit;text-align:left;border:0;cursor:pointer;width:100%}
  .vd-cell:hover{background:#eceae4}
  .vd-label{font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;
            color:var(--ink-muted);margin-bottom:1px}
  .vd-cell .tag{display:none;font-size:10px;font-weight:600;color:#fff;background:var(--ink);
                border-radius:99px;padding:1px 6px;vertical-align:1px}
  .vd-cell.viewing .tag{display:inline-block}
  .vd-cell.viewing{outline:2px solid var(--ink);outline-offset:-2px}
  .vd-hint{margin-top:7px;font-size:11px;color:var(--ink-muted)}
  .help{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;
        border-radius:99px;border:1px solid var(--baseline);color:var(--ink-muted);
        font-size:10px;cursor:help;margin-left:5px;vertical-align:1px}
  .note{font-size:11.5px;color:var(--ink-muted);line-height:1.55;margin-top:8px}
  .note b{color:var(--ink-2);font-weight:600}
  .sc-row{display:flex;gap:8px;margin-bottom:8px}
  .sc{flex:1;background:var(--plane);border-radius:7px;padding:7px 9px}
  .sc .k{font-size:11px;color:var(--ink-muted)}
  .sc .v{font-size:16px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.25}
  .sc .s{font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .sc.alert{box-shadow:inset 0 0 0 1.5px var(--warn)}
  .sc.bad{box-shadow:inset 0 0 0 1.5px var(--crit)}

  .modes{display:flex;border:1px solid var(--hair);border-radius:7px;overflow:hidden;flex-wrap:wrap}
  .modes button{flex:1 1 44%;padding:7px 4px;font:inherit;font-size:12px;cursor:pointer;
                background:var(--surface);color:var(--ink-2);border:0;border-right:1px solid var(--hair);
                border-bottom:1px solid var(--hair)}
  .modes button[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:560}

  .legend{display:flex;flex-direction:column;gap:1px}
  .lg-row{display:grid;grid-template-columns:14px 1fr auto;gap:9px;align-items:center;
          padding:4px 5px;border-radius:5px;font-size:12.5px}
  .lg-row .sw{width:14px;height:14px;border-radius:3px;box-shadow:inset 0 0 0 1px var(--hair)}
  .lg-row .n{font-variant-numeric:tabular-nums;color:var(--ink-muted)}

  /* 參數 */
  .ctl{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin-bottom:10px}
  .ctl label{font-size:12.5px;color:var(--ink-2)}
  .ctl output{font-size:12.5px;font-weight:620;font-variant-numeric:tabular-nums;min-width:62px;text-align:right}
  .ctl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--ink);margin:0}
  .ctl .hint{grid-column:1/-1;font-size:11px;color:var(--ink-muted);margin-top:-2px}
  #reset{font:inherit;font-size:12px;padding:5px 10px;border-radius:6px;cursor:pointer;
         background:var(--surface);border:1px solid var(--hair);color:var(--ink-2)}

  table.tv{width:100%;border-collapse:collapse;font-size:11.5px}
  table.tv th,table.tv td{padding:4px 4px;text-align:right;border-bottom:1px solid var(--grid)}
  table.tv th{color:var(--ink-muted);font-weight:600;font-size:10.5px;white-space:nowrap}
  table.tv td{font-variant-numeric:tabular-nums}
  table.tv .l{text-align:left}
  table.tv tbody tr{cursor:pointer}
  table.tv tbody tr:hover{background:var(--plane)}

  .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px}
  .kv dt{color:var(--ink-muted)}
  .kv dd{margin:0;font-variant-numeric:tabular-nums;text-align:right}

  #profile{flex:none;background:var(--surface);border-top:1px solid var(--hair);padding:7px 16px 5px}
  #profile svg{display:block;width:100%;height:150px;overflow:visible}
  #profile .ttl{display:flex;justify-content:space-between;align-items:baseline;
                font-size:11.5px;color:var(--ink-muted);margin-bottom:2px}
  #readout{font-variant-numeric:tabular-nums;color:var(--ink-2)}
  #readout b{color:var(--ink)}
  .ax{font-size:10px;fill:var(--ink-muted);font-variant-numeric:tabular-nums}
  .gl{stroke:var(--grid);stroke-width:1}
  .bl{stroke:var(--baseline);stroke-width:1}
  .runlab{font-size:10px;font-weight:600}

  .leaflet-container{font:inherit}
  .tip{font-size:12.5px;line-height:1.5}
  .tip .h{font-weight:650;margin-bottom:3px}
  .tip table{border-collapse:collapse}
  .tip td{padding:1px 0}
  .tip td:first-child{color:var(--ink-muted);padding-right:10px}
  .tip td:last-child{font-variant-numeric:tabular-nums;text-align:right}

  #err{margin:16px;padding:14px 16px;border-radius:8px;background:#fdf2f2;
       border:1px solid var(--crit);color:#7a1d1d;white-space:pre-wrap;
       font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
  #busy{position:absolute;inset:0;background:rgba(252,252,251,.6);display:none;
        align-items:center;justify-content:center;z-index:900;font-size:13px;color:var(--ink-2)}
  #busy.on{display:flex}

  @media (max-width:880px){
    body{overflow:auto}
    main{flex-direction:column}
    #panel{width:auto;border-right:0;border-bottom:1px solid var(--hair)}
    #map{min-height:52vh}
    #profile svg{height:124px}
  }
</style>
</head>
<body>

<header>
  <h1>環騎臺北 · 騎乘條件</h1>
  <span class="meta" id="hdrRoute">—</span>
  <span class="spacer"></span>
  <span id="stale"></span>
  <span class="meta" id="hdrTime">載入中…</span>
</header>

<main style="position:relative">
  <div id="panel">

    <div id="verdict">
      <div class="vd-label">建議方向</div>
      <div class="vd-row">
        <span class="vd-dir" id="vdDir">—</span>
        <span class="vd-gain" id="vdGain"></span>
      </div>
      <div class="vd-sub" id="vdSub"></div>
      <div class="vd-hint">點下面任一欄，可切換地圖上檢視的騎乘方向</div>
      <div class="vd-split">
        <button class="vd-cell" id="cellCW" data-dir="CW">
          <div class="k">順時針 <span class="tag">檢視中</span></div><div class="v" id="vCW">—</div></button>
        <button class="vd-cell" id="cellCCW" data-dir="CCW">
          <div class="k">逆時針 <span class="tag">檢視中</span></div><div class="v" id="vCCW">—</div></button>
      </div>
    </div>

    <div class="sec">
      <h2>檢視的騎乘方向</h2>
      <div class="modes" id="dirs">
        <button data-dir="CCW" aria-pressed="true">逆時針</button>
        <button data-dir="CW"  aria-pressed="false">順時針</button>
      </div>
      <div class="note" style="margin-top:6px">
        切換後，底部剖面與色帶的里程也會依該方向重新排列（起點都是島頭公園）。
      </div>

      <h2 style="margin-top:16px">著色依據</h2>
      <div class="modes" id="modes">
        <button data-mode="wind" aria-pressed="true">順逆風</button>
        <button data-mode="surface" aria-pressed="false">路面濕度</button>
        <button data-mode="radar" aria-pressed="false">雷達回波</button>
        <button data-mode="forecast" aria-pressed="false">預報降雨</button>
        <button data-mode="exposure" aria-pressed="false">曝露度</button>
        <button data-mode="grade" aria-pressed="false">坡度</button>
      </div>
      <div class="legend" id="legend" style="margin-top:10px"></div>
    </div>

    <div class="sec">
      <h2>騎乘參數</h2>
      <div class="ctl">
        <label for="pw">目標功率</label><output id="pwOut"></output>
        <input type="range" id="pw" min="40" max="300" step="5">
      </div>
      <div class="ctl">
        <label for="mk">總質量（你+車+裝備）</label><output id="mkOut"></output>
        <input type="range" id="mk" min="45" max="130" step="1">
      </div>
      <div class="ctl">
        <label for="cda">CdA 風阻面積</label><output id="cdaOut"></output>
        <input type="range" id="cda" min="0.20" max="0.60" step="0.005">
        <div class="hint" id="cdaHint"></div>
      </div>
      <div class="ctl">
        <label for="crr">Crr 滾阻係數</label><output id="crrOut"></output>
        <input type="range" id="crr" min="0.002" max="0.015" step="0.0002">
      </div>
      <button id="reset">回到校正值</button>
    </div>

    <div class="sec">
      <h2>曝露度係數</h2>
      <div class="ctl">
        <label for="kr">河濱</label><output id="krOut"></output>
        <input type="range" id="kr" min="0" max="1.5" step="0.05">
      </div>
      <div class="ctl">
        <label for="ku">市區</label><output id="kuOut"></output>
        <input type="range" id="ku" min="0" max="1.5" step="0.05">
      </div>
      <div class="ctl">
        <label for="km_">山區</label><output id="kmOut"></output>
        <input type="range" id="km_" min="0" max="1.5" step="0.05">
      </div>
      <div class="hint" style="font-size:11px;color:var(--ink-muted)">
        方向判斷只取決於三者的<b>差值</b>；同加常數不影響結果。
      </div>
    </div>

    <div class="sec">
      <h2>路面與紫外線</h2>
      <div id="surfCard"></div>
      <div id="radarCard"></div>
      <div id="nowcastCard"></div>
      <svg id="ncChart" viewBox="0 0 300 64" style="width:100%;display:block;margin-top:8px"></svg>
      <svg id="uvChart" viewBox="0 0 300 78" style="width:100%;display:block;margin-top:10px"></svg>
      <div class="note" id="surfHelp"></div>
    </div>

    <div class="sec">
      <h2>風向與臨界方位</h2>
      <div class="note" id="windHelp"></div>
      <svg id="compass" viewBox="0 0 220 220" style="width:100%;max-width:230px;display:block;margin:0 auto"></svg>
      <dl class="kv" id="windKv" style="margin-top:10px"></dl>
    </div>

    <div class="sec">
      <h2>圖層</h2>
      <label style="display:flex;gap:8px;align-items:center;font-size:12.5px;cursor:pointer">
        <input type="checkbox" id="tArrows" checked> 風向箭頭</label>
      <div class="note" id="arrowHelp"></div>
      <label style="display:flex;gap:8px;align-items:center;font-size:12.5px;cursor:pointer;margin-top:6px">
        <input type="checkbox" id="tStations"> 氣象測站</label>
      <label style="display:flex;gap:8px;align-items:center;font-size:12.5px;cursor:pointer;margin-top:6px">
        <input type="checkbox" id="tRain" checked> 雨量站（圈大小＝水膜厚度）</label>
      <label style="display:flex;gap:8px;align-items:center;font-size:12.5px;cursor:pointer;margin-top:6px">
        <input type="checkbox" id="tEcho" checked> 雷達回波格點</label>
    </div>

    <div class="sec">
      <h2>路段明細</h2>
      <table class="tv" id="tbl"></table>
    </div>

    <div class="sec">
      <h2>資料與模型</h2>
      <dl class="kv" id="metaKv"></dl>
    </div>

  </div>

  <div id="map"></div>
  <div id="busy">更新中…</div>
</main>

<div id="profile">
  <div class="ttl">
    <span id="profTitle">高度剖面 + 沿路線分類色帶</span>
    <span id="readout">游標移到剖面或地圖上的路段</span>
  </div>
  <svg id="svg" preserveAspectRatio="none"></svg>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
</body>
</html>
